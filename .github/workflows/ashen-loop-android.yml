name: ashen-loop-android

on:
  push:
    branches: [ main, master ]
    paths:
      - 'AshenLoop/**'
      - '.github/workflows/ashen-loop-android.yml'
  pull_request:
    paths:
      - 'AshenLoop/**'
      - '.github/workflows/ashen-loop-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AshenLoop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKM" ]; then
            echo "sdkmanager not found under $SDK"
            exit 1
          fi
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ashen-loop-debug-apk
          path: AshenLoop/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
