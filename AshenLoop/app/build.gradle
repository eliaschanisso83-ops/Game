plugins {
    id "com.android.application"
}

android {
    namespace "com.ashenloop"
    compileSdk 34

    defaultConfig {
        applicationId "com.ashenloop"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "0.1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildToolsVersion "34.0.0"

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
