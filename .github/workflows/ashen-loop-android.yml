name: ashen-loop-android

on:
  push:
    branches: [ main, master ]
    paths:
      - 'AshenLoop/**'
      - '.github/workflows/ashen-loop-android.yml'
  pull_request:
    paths:
      - 'AshenLoop/**'
      - '.github/workflows/ashen-loop-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AshenLoop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ashen-loop-debug-apk
          path: AshenLoop/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
